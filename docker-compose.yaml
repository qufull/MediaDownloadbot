services:
  redis:
      image: redis:7-alpine
      restart: unless-stopped
      container_name: media-bot-redis
      ports:
        - "${REDIS_PORT:-6379}:6379"
      volumes:
        - redis_data:/data
      command: redis-server --appendonly yes
      healthcheck:
        test: [ "CMD", "redis-cli", "ping" ]
        interval: 10s
        timeout: 5s
        retries: 3
        start_period: 5s

  telegram-bot-api:
      image: aiogram/telegram-bot-api:latest
      restart: unless-stopped
      container_name: media-bot-telegram-bot-api
      ports:
        - "${TELEGRAM_HTTP_PORT:-8081}:8081"
      environment:
        TELEGRAM_API_ID: "${TELEGRAM_API_ID}"
        TELEGRAM_API_HASH: "${TELEGRAM_API_HASH}"
      volumes:
        - media_storage:/app/src/storage/downloads:ro
      command:
        - "--local"
        - "--api-id=${TELEGRAM_API_ID}"
        - "--api-hash=${TELEGRAM_API_HASH}"
        - "--http-port=8081"
        - "--dir=/tmp/telegram-bot-api"
        - "--temp-dir=/tmp"
        - "--username=root"
        - "--groupname=root"
        - "--verbose"

  bot:
      build: .
      restart: unless-stopped
      container_name: media-bot
      ports:
        - "8080:8000"
      env_file:
        - .env
      volumes:
        - media_storage:/app/src/storage/downloads
        - user_data:/app/data
        - ./cookies:/app/cookies
      environment:
        BOT_SERVER_URL: "http://telegram-bot-api:${TELEGRAM_HTTP_PORT:-8081}"
      deploy:
        resources:
          limits:
            memory: 1536M
      command: [ "sh", "-c",
        "uv run python -m celery -A src.celery_app.app:celery_app worker -Q download_audio_queue,extract_queue,download_youtube_queue,download_rutube_queue,download_reddit_queue,download_tiktok_queue,download_twitter_queue,download_instagram_queue,download_vk_queue,cleanup_queue -n worker@%h -c 2 -P prefork --max-tasks-per-child=10 --max-memory-per-child=400000 --loglevel=warning & \
              uv run python -m celery -A src.celery_app.app:celery_app beat --loglevel=warning --pidfile=celerybeat.pid & \
              uv run python main.py"
      ]
      depends_on:
        redis:
          condition: service_healthy
        telegram-bot-api:
          condition: service_started

  cookie-refresher:
      build:
        context: ./cookie_refresher
        dockerfile: Dockerfile
      container_name: cookie-refresher
      profiles:
        - refresh
      volumes:
        - ./cookies:/app/cookies
      environment:
        - REFRESH_SITES=tiktok,twitter
      restart: "no"

volumes:
  redis_data:
  media_storage:
  user_data:


